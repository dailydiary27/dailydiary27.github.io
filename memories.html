
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unser Tagebuch ♡ | DailyDiary</title>
<style>
:root {
  --pink:#f8dce8;
  --cream:#fffdf5;
  --ink:#352831;
  --muted:#967f8b;
  --line:#ecdce4;
  --accent:#c17f9f;
}
* { box-sizing:border-box; }
[hidden] { display:none!important; }

body {
  margin:0;
  background:var(--pink);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}
main {
  max-width:760px;
  margin:auto;
  padding:26px 16px 70px;
}
.back {
  display:inline-block;
  color:#956f83;
  text-decoration:none;
  margin:4px 0 24px;
}
header {
  text-align:center;
  margin-bottom:25px;
}
h1 {
  font-size:clamp(2rem,7vw,3.2rem);
  margin:0 0 12px;
}
header p {
  color:var(--muted);
  line-height:1.5;
}
.panel {
  background:var(--cream);
  border-radius:26px;
  padding:25px;
  margin:17px 0;
}
h2 {
  font-size:1.45rem;
  font-weight:normal;
  margin:0 0 18px;
}
label {
  display:block;
  color:#715b68;
  margin-bottom:6px;
}
input,textarea,select {
  width:100%;
  border:1px solid var(--line);
  background:#fdf9fa;
  border-radius:13px;
  padding:13px;
  color:var(--ink);
  font:inherit;
  font-size:16px;
}
textarea {
  min-height:155px;
  resize:vertical;
  line-height:1.55;
}
.form-grid {
  display:grid;
  gap:15px;
}
.two {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button {
  font:inherit;
  cursor:pointer;
}
.btn {
  border:0;
  border-radius:13px;
  padding:13px 18px;
}
.primary {
  background:var(--accent);
  color:white;
}
.secondary {
  background:#efe2e9;
  color:#55434e;
}
button:disabled { opacity:.55; }

.actions {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}
#status {
  min-height:22px;
  margin:13px 0;
  color:#795e6d;
  line-height:1.5;
}
#status.error { color:#a3334c; }

.filters {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0;
}
.filter {
  border:1px solid var(--line);
  background:#fdf9fa;
  color:#715b68;
  border-radius:22px;
  padding:10px 13px;
}
.filter.active {
  border-color:var(--accent);
  background:#f2e3eb;
}
.search { margin-top:14px; }

.month {
  margin:23px 0 13px;
  color:#836777;
  font-size:1.1rem;
  font-weight:normal;
}
.memory {
  background:#fdf9fa;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin:12px 0;
}
.memory h3 {
  margin:9px 0;
  overflow-wrap:anywhere;
}
.meta {
  color:var(--muted);
  font:13px Arial,sans-serif;
  line-height:1.5;
}
.pill {
  display:inline-block;
  border:1px solid var(--line);
  border-radius:20px;
  padding:4px 9px;
  color:#826774;
  font:12px Arial,sans-serif;
}
.memory-body {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.6;
  margin-top:14px;
}
.memory-actions {
  display:flex;
  gap:9px;
  margin-top:15px;
}
.memory-actions button {
  background:#f2e7ed;
  color:#6e5362;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
}
.empty {
  text-align:center;
  color:var(--muted);
  padding:24px 0;
}
.helper {
  color:var(--muted);
  font-size:.86rem;
}
@media(max-width:440px) {
  .panel { padding:20px 15px; }
  .two { grid-template-columns:1fr; }
  .btn { flex:1; }
}
</style>
</head>
<body>
<main>
<a class="back" href="home.html">
  ‹ Zurück zur Startseite
</a>

<header>
  <h1>Unser Tagebuch ♡</h1>
  <p>Augenblicke, Gedanken und Erinnerungen.</p>
</header>

<p id="status" role="status">
  Anmeldung wird geprüft …
</p>

<section id="login" class="panel" hidden>
  <h2>Bitte zuerst anmelden ♡</h2>
  <a href="login.html">Zur Anmeldung</a>
</section>

<div id="app" hidden>

<section class="panel">
  <h2 id="formHeading">Neue Erinnerung ♡</h2>

  <form id="memoryForm" class="form-grid">

    <div>
      <label for="title">Titel *</label>
      <input id="title" maxlength="200" required
        placeholder="Unser schönster Abend ♡">
    </div>

    <div>
      <label for="content">Deine Erinnerung</label>
      <textarea id="content"
        placeholder="Was möchtest du nie vergessen?"></textarea>
    </div>

    <div class="two">
      <div>
        <label for="memoryDate">Datum *</label>
        <input id="memoryDate" type="date" required>
      </div>
      <div>
        <label for="mood">Stimmung</label>
        <select id="mood">
          <option value="">Keine Angabe</option>
          <option value="romantic">💗 Verliebt</option>
          <option value="happy">☀️ Glücklich</option>
          <option value="excited">✨ Aufgeregt</option>
          <option value="grateful">🌷 Dankbar</option>
          <option value="calm">🍃 Entspannt</option>
          <option value="thoughtful">💭 Nachdenklich</option>
        </select>
      </div>
    </div>

    <div class="two">
      <div>
        <label for="locationName">Ort (optional)</label>
        <input id="locationName" maxlength="150"
          placeholder="z. B. München">
      </div>
      <div>
        <label for="visibility">Sichtbarkeit</label>
        <select id="visibility">
          <option value="private">Nur für mich</option>
          <option value="shared">Gemeinsam</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="saveButton"
        class="btn primary" type="submit">
        Erinnerung speichern ♡
      </button>
      <button id="cancelButton"
        class="btn secondary" type="button" hidden>
        Bearbeitung abbrechen
      </button>
    </div>
  </form>

  <p class="helper">
    Fotos und Kommentare ergänzen wir später.
  </p>
</section>

<section class="panel">
  <h2>Unsere Erinnerungen ♡</h2>
  <div id="filters" class="filters"></div>

  <label for="search">Erinnerungen suchen</label>
  <input id="search" class="search" type="search"
    placeholder="Nach Titel, Text oder Ort suchen …">

  <div id="timeline"></div>
</section>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL =
  "https://cqgrtybenbanfppoiuba.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oxqVUkLdxj40fLZ8zCfjtw_wFSftxDw";

const $ = id => document.getElementById(id);

let client = null;
let user = null;
let memories = [];
let filter = "all";
let editingId = null;

const moods = {
  romantic:"💗 Verliebt",
  happy:"☀️ Glücklich",
  excited:"✨ Aufgeregt",
  grateful:"🌷 Dankbar",
  calm:"🍃 Entspannt",
  thoughtful:"💭 Nachdenklich"
};

function status(message,error=false) {
  $("status").textContent = message;
  $("status").className = error ? "error" : "";
}

function todayKey() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function dateLabel(key) {
  return new Date(key+"T12:00:00")
    .toLocaleDateString("de-DE",{
      day:"numeric",
      month:"long",
      year:"numeric"
    });
}

function monthLabel(key) {
  return new Date(key+"T12:00:00")
    .toLocaleDateString("de-DE",{
      month:"long",
      year:"numeric"
    });
}

function make(tag,text,css="") {
  const node = document.createElement(tag);
  if(text !== undefined) node.textContent = text;
  if(css) node.className = css;
  return node;
}

function button(text,handler) {
  const node = make("button",text);
  node.type = "button";
  node.addEventListener("click",handler);
  return node;
}

function renderFilters() {
  const holder = $("filters");
  holder.replaceChildren();

  const options = [
    ["all","Alle"],
    ["shared","♡ Gemeinsam"],
    ["private","🔒 Nur für mich"]
  ];

  for(const [value,label] of options) {
    const node = button(label,()=>{
      filter = value;
      renderFilters();
      renderTimeline();
    });

    node.className = "filter" +
      (filter === value ? " active" : "");

    node.setAttribute(
      "aria-pressed",
      String(filter === value)
    );

    holder.append(node);
  }
}

function renderTimeline() {
  const holder = $("timeline");
  holder.replaceChildren();

  const term = $("search").value
    .trim().toLocaleLowerCase("de-DE");

  const visible = memories.filter(item=>{
    if(filter !== "all" &&
       item.visibility !== filter) return false;

    if(!term) return true;

    return [
      item.title,
      item.content,
      item.location_name
    ].some(value=>
      (value||"").toLocaleLowerCase("de-DE")
        .includes(term)
    );
  });

  if(!visible.length) {
    holder.append(make(
      "p",
      "Hier sind noch keine passenden Erinnerungen ♡",
      "empty"
    ));
    return;
  }

  let previousMonth = "";

  for(const item of visible) {
    const month = item.memory_date.slice(0,7);

    if(month !== previousMonth) {
      holder.append(make(
        "h3",
        monthLabel(item.memory_date),
        "month"
      ));
      previousMonth = month;
    }

    const card = make("article",undefined,"memory");

    const meta = make(
      "div",dateLabel(item.memory_date),"meta"
    );

    if(item.location_name) {
      meta.textContent += " · 📍 " + item.location_name;
    }

    card.append(meta);
    card.append(make("h3",item.title));

    card.append(make(
      "span",
      item.visibility === "shared"
        ? "♡ Gemeinsam" : "🔒 Privat",
      "pill"
    ));

    if(item.mood) {
      card.append(document.createTextNode(
        "  " + (moods[item.mood]||item.mood)
      ));
    }

    if(item.content) {
      card.append(make(
        "p",item.content,"memory-body"
      ));
    }

    if(item.owner_id === user.id) {
      const actions = make(
        "div",undefined,"memory-actions"
      );

      actions.append(
        button("Bearbeiten",()=>startEdit(item)),
        button("Löschen",()=>removeMemory(item))
      );

      card.append(actions);
    }

    holder.append(card);
  }
}

async function loadMemories() {
  const {data,error} = await client
    .from("dd_memories")
    .select(
      "id,owner_id,visibility,title,content,"+
      "memory_date,mood,location_name,created_at"
    )
    .order("memory_date",{ascending:false})
    .order("created_at",{ascending:false})
    .limit(500);

  if(error) {
    status(
      "Laden fehlgeschlagen: "+error.message,
      true
    );
    return false;
  }

  memories = data||[];
  renderTimeline();
  return true;
}

function resetForm() {
  editingId = null;
  $("memoryForm").reset();
  $("memoryDate").value = todayKey();

  $("formHeading").textContent =
    "Neue Erinnerung ♡";

  $("saveButton").textContent =
    "Erinnerung speichern ♡";

  $("cancelButton").hidden = true;
}

function startEdit(item) {
  if(item.owner_id !== user.id) return;

  editingId = item.id;

  $("title").value = item.title;
  $("content").value = item.content||"";
  $("memoryDate").value = item.memory_date;
  $("mood").value = item.mood||"";
  $("locationName").value =
    item.location_name||"";
  $("visibility").value = item.visibility;

  $("formHeading").textContent =
    "Erinnerung bearbeiten ♡";

  $("saveButton").textContent =
    "Änderungen speichern ♡";

  $("cancelButton").hidden = false;

  $("memoryForm").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

$("cancelButton").addEventListener(
  "click",resetForm
);

$("search").addEventListener(
  "input",renderTimeline
);

$("memoryForm").addEventListener(
  "submit",
  async event=>{
    event.preventDefault();

    const payload = {
      title:$("title").value.trim(),
      content:$("content").value.trim(),
      memory_date:$("memoryDate").value,
      mood:$("mood").value||null,
      location_name:
        $("locationName").value.trim()||null,
      visibility:$("visibility").value
    };

    if(!payload.title||!payload.memory_date) {
      return;
    }

    $("saveButton").disabled = true;
    status("Erinnerung wird gespeichert …");

    try {
      const query = editingId
        ? client.from("dd_memories")
            .update(payload)
            .eq("id",editingId)
            .eq("owner_id",user.id)
        : client.from("dd_memories")
            .insert({
              ...payload,
              owner_id:user.id
            });

      const {data,error} =
        await query.select("id");

      if(error) throw error;

      if(!data?.length) {
        throw new Error(
          "Kein Datensatz gespeichert."
        );
      }

      resetForm();

      if(await loadMemories()) {
        status("Erinnerung gespeichert ♡");
      }

    } catch(error) {
      status(
        "Speichern fehlgeschlagen: "+
        error.message,
        true
      );
    } finally {
      $("saveButton").disabled = false;
    }
  }
);

async function removeMemory(item) {
  if(item.owner_id !== user.id) return;

  if(!confirm(
    "Diese Erinnerung wirklich löschen?"
  )) return;

  const {data,error} = await client
    .from("dd_memories")
    .delete()
    .eq("id",item.id)
    .eq("owner_id",user.id)
    .select("id");

  if(error||!data?.length) {
    status(
      "Löschen fehlgeschlagen: "+
      (error?.message||"Keine Berechtigung"),
      true
    );
    return;
  }

  if(editingId === item.id) resetForm();

  if(await loadMemories()) {
    status("Erinnerung gelöscht ♡");
  }
}

async function init() {
  if(!window.supabase?.createClient) {
    throw new Error(
      "Supabase konnte nicht geladen werden."
    );
  }

  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const auth = await client.auth.getUser();

  if(auth.error||!auth.data.user) {
    $("login").hidden = false;
    status("Bitte melde dich zuerst an.");
    return;
  }

  user = auth.data.user;

  const {data,error} = await client
    .from("dd_members")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error) throw error;

  if(!data) {
    status(
      "Dein Konto ist noch nicht freigeschaltet.",
      true
    );
    return;
  }

  $("app").hidden = false;
  resetForm();
  renderFilters();

  if(await loadMemories()) {
    status("Willkommen in eurem Tagebuch ♡");
  }
}

init().catch(error=>{
  status(
    "Verbindungsfehler: "+error.message,
    true
  );
});
</script>
</body>
</html>
