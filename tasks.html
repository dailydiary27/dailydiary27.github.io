
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unsere Aufgaben ♡ | DailyDiary</title>
<style>
:root {
  --pink:#f8dce8;
  --cream:#fffdf5;
  --ink:#352831;
  --muted:#937f8b;
  --line:#ecdce4;
  --accent:#c17f9f;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--pink);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}
main {
  max-width:720px;
  margin:auto;
  padding:28px 18px 70px;
}
.back {
  display:inline-block;
  color:#956f83;
  text-decoration:none;
  margin:6px 0 24px;
}
.hero { text-align:center; margin-bottom:26px; }
.hero h1 {
  font-size:clamp(2.1rem,8vw,3.5rem);
  margin:0 0 10px;
}
.hero p { color:var(--muted); margin:0; }
.panel {
  background:var(--cream);
  border-radius:28px;
  padding:24px;
  margin:18px 0;
}
.panel h2 { font-size:1.55rem; margin:0 0 18px; }
.categories {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.cat {
  border:1px solid var(--line);
  background:#fdf9fa;
  border-radius:17px;
  padding:14px 4px;
  min-height:76px;
  color:#6b5662;
  font-family:inherit;
  font-size:.88rem;
  cursor:pointer;
}
.cat .emoji {
  display:block;
  font-size:1.5rem;
  margin-bottom:7px;
}
.cat.active {
  border-color:var(--accent);
  background:#f4e7ee;
}
.fields { display:grid; gap:12px; }
label {
  display:block;
  font-size:.95rem;
  color:#6c5663;
  margin-bottom:5px;
}
input,textarea,select {
  width:100%;
  padding:13px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fdf9fa;
  color:var(--ink);
  font:inherit;
  font-size:1rem;
}
textarea { min-height:85px; resize:vertical; }
.two {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn {
  border:0;
  border-radius:13px;
  padding:14px 18px;
  font:inherit;
  font-size:1rem;
  cursor:pointer;
}
.primary { background:var(--accent); color:white; }
.secondary { background:#efe2e9; color:#55434e; }
.btn:disabled { opacity:.55; }
.actions { display:flex; gap:10px; flex-wrap:wrap; }
.task {
  border:1px solid var(--line);
  background:#fdf9fa;
  border-radius:17px;
  padding:15px;
  margin-top:12px;
}
.task-top { display:flex; align-items:flex-start; gap:10px; }
.task-top input {
  width:20px;
  height:20px;
  accent-color:var(--accent);
  margin-top:3px;
  flex-shrink:0;
}
.task-body { flex:1; min-width:0; }
.task-title {
  font-weight:bold;
  font-size:1.08rem;
  overflow-wrap:anywhere;
}
.done .task-title {
  text-decoration:line-through;
  opacity:.6;
}
.meta {
  color:var(--muted);
  font-size:.85rem;
  margin-top:6px;
}
.notes {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin:10px 0 0;
  font-size:.95rem;
}
.task-actions { display:flex; gap:8px; margin-top:12px; }
.task-actions button {
  border:1px solid var(--line);
  border-radius:10px;
  background:#f4eaf0;
  color:#6d5261;
  padding:8px 12px;
  font:inherit;
}
.toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.toolbar label {
  margin:0;
  display:flex;
  align-items:center;
  gap:7px;
}
.toolbar input { width:auto; accent-color:var(--accent); }
#status {
  min-height:24px;
  color:#866577;
  font-size:.95rem;
  margin:12px 0;
}
#status.error { color:#a4324b; }
.empty {
  color:var(--muted);
  text-align:center;
  padding:25px 0;
}
#login,#app { display:none; }
#login { text-align:center; }
@media(max-width:420px) {
  .panel { padding:18px; }
  .categories { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .two { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<main>
<a class="back" href="home.html">‹ Zurück zur Startseite</a>

<header class="hero">
  <h1>Unsere Aufgaben ♡</h1>
  <p>Gemeinsam alles im Blick behalten</p>
</header>

<div id="status" role="status" aria-live="polite">
  Anmeldung wird geprüft …
</div>

<section id="login" class="panel">
  <h2>Bitte anmelden ♡</h2>
  <p>Deine Aufgaben sind nur für angemeldete Mitglieder sichtbar.</p>
  <a class="back" href="index.html">Zur Anmeldung</a>
</section>

<div id="app">
  <section class="panel">
    <h2>Unsere Bereiche</h2>
    <div class="categories" id="categories"></div>
  </section>

  <section class="panel">
    <h2 id="formHeading">Neue Aufgabe ♡</h2>
    <form id="taskForm" class="fields">
      <div>
        <label for="title">Aufgabe *</label>
        <input id="title" maxlength="200" required
          placeholder="Was möchten wir erledigen?">
      </div>

      <div>
        <label for="notes">Notizen</label>
        <textarea id="notes"
          placeholder="Weitere Informationen …"></textarea>
      </div>

      <div class="two">
        <div>
          <label for="category">Bereich</label>
          <select id="category">
            <option value="shared">Gemeinsam</option>
            <option value="personal">Persönlich</option>
            <option value="shopping">Einkäufe</option>
            <option value="household">Haushalt</option>
            <option value="travel">Reisen</option>
            <option value="wishes">Wünsche</option>
          </select>
        </div>
        <div>
          <label for="priority">Priorität</label>
          <select id="priority">
            <option value="low">Niedrig</option>
            <option value="normal" selected>Normal</option>
            <option value="high">Hoch</option>
          </select>
        </div>
      </div>

      <div class="two">
        <div>
          <label for="dueDate">Fällig am</label>
          <input id="dueDate" type="date">
        </div>
        <div>
          <label for="visibility">Sichtbarkeit</label>
          <select id="visibility">
            <option value="shared">Gemeinsam</option>
            <option value="private">Nur für mich</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="saveButton" type="submit">
          Aufgabe speichern ♡
        </button>
        <button class="btn secondary" id="cancelButton"
          type="button" hidden>Abbrechen</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h2 style="margin:0">Aufgaben</h2>
      <label>
        <input type="checkbox" id="showDone">
        Erledigte anzeigen
      </label>
    </div>
    <div id="tasks"></div>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL =
  "https://cqgrtybenbanfppoiuba.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_oxqVUkLdxj40fLZ8zCfjtw_wFSftxDw";

const $ = id => document.getElementById(id);

let client = null;
let user = null;
let tasks = [];
let filter = "all";
let editingId = null;

const categories = [
  ["all","♡","Alle"],
  ["shared","♡","Gemeinsam"],
  ["personal","👤","Persönlich"],
  ["shopping","🛒","Einkäufe"],
  ["household","⌂","Haushalt"],
  ["travel","✈","Reisen"],
  ["wishes","☆","Wünsche"]
];

const categoryNames = Object.fromEntries(
  categories.map(([key,,name]) => [key,name])
);

const priorityNames = {
  low:"Niedrig",
  normal:"Normal",
  high:"Hoch"
};

function status(message,error=false) {
  $("status").textContent = message;
  $("status").className = error ? "error" : "";
}

function makeButton(text,fn) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = text;
  button.addEventListener("click",fn);
  return button;
}

function renderCategories() {
  const container = $("categories");
  container.replaceChildren();

  for (const [key,emoji,name] of categories) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "cat" + (filter === key ? " active" : "");
    button.setAttribute("aria-pressed",String(filter === key));

    const icon = document.createElement("span");
    icon.className = "emoji";
    icon.textContent = emoji;

    button.append(icon,document.createTextNode(name));
    button.addEventListener("click",() => {
      filter = key;
      renderCategories();
      renderTasks();
    });

    container.append(button);
  }
}

function renderTasks() {
  const container = $("tasks");
  container.replaceChildren();

  const visible = tasks.filter(task =>
    (filter === "all" || task.category === filter) &&
    ($("showDone").checked || !task.is_done)
  );

  if (!visible.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Hier sind noch keine Aufgaben ♡";
    container.append(empty);
    return;
  }

  for (const task of visible) {
    const card = document.createElement("article");
    card.className = "task" + (task.is_done ? " done" : "");

    const top = document.createElement("div");
    top.className = "task-top";

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = task.is_done;
    check.setAttribute("aria-label","Aufgabe erledigt: " + task.title);

    const own = task.owner_id === user.id;
    check.disabled = !own;

    check.addEventListener("change",async () => {
      check.disabled = true;

      const {error} = await client
        .from("dd_tasks")
        .update({is_done:check.checked})
        .eq("id",task.id)
        .eq("owner_id",user.id);

      if (error) {
        status("Änderung fehlgeschlagen: " + error.message,true);
      } else {
        status("Aufgabe aktualisiert ♡");
      }
      await loadTasks();
    });

    const body = document.createElement("div");
    body.className = "task-body";

    const title = document.createElement("div");
    title.className = "task-title";
    title.textContent = task.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [
      categoryNames[task.category] || task.category,
      priorityNames[task.priority] || task.priority,
      task.due_date
        ? "Fällig: " + task.due_date.split("-").reverse().join(".")
        : "",
      task.visibility === "private" ? "Privat" : "Gemeinsam"
    ].filter(Boolean).join(" · ");

    body.append(title,meta);

    if (task.notes) {
      const notes = document.createElement("p");
      notes.className = "notes";
      notes.textContent = task.notes;
      body.append(notes);
    }

    top.append(check,body);
    card.append(top);

    if (own) {
      const actions = document.createElement("div");
      actions.className = "task-actions";
      actions.append(
        makeButton("Bearbeiten",() => startEdit(task)),
        makeButton("Löschen",() => removeTask(task))
      );
      card.append(actions);
    }

    container.append(card);
  }
}

async function loadTasks() {
  const {data,error} = await client
    .from("dd_tasks")
    .select("id,owner_id,title,notes,category,priority,due_date,is_done,visibility,created_at")
    .order("created_at",{ascending:false});

  if (error) {
    status("Aufgaben konnten nicht geladen werden: " + error.message,true);
    return;
  }

  tasks = data || [];
  renderTasks();
}

function resetForm() {
  $("taskForm").reset();
  editingId = null;
  $("formHeading").textContent = "Neue Aufgabe ♡";
  $("saveButton").textContent = "Aufgabe speichern ♡";
  $("cancelButton").hidden = true;
}

function startEdit(task) {
  editingId = task.id;
  $("title").value = task.title;
  $("notes").value = task.notes || "";
  $("category").value = task.category;
  $("priority").value = task.priority;
  $("dueDate").value = task.due_date || "";
  $("visibility").value = task.visibility;

  $("formHeading").textContent = "Aufgabe bearbeiten ♡";
  $("saveButton").textContent = "Änderungen speichern";
  $("cancelButton").hidden = false;
  $("taskForm").scrollIntoView({behavior:"smooth",block:"start"});
}

async function removeTask(task) {
  if (!confirm("Diese Aufgabe wirklich löschen?")) return;

  const {error} = await client
    .from("dd_tasks")
    .delete()
    .eq("id",task.id)
    .eq("owner_id",user.id);

  if (error) {
    status("Löschen fehlgeschlagen: " + error.message,true);
    return;
  }

  if (editingId === task.id) resetForm();
  status("Aufgabe gelöscht ♡");
  await loadTasks();
}

$("cancelButton").addEventListener("click",resetForm);
$("showDone").addEventListener("change",renderTasks);

$("taskForm").addEventListener("submit",async event => {
  event.preventDefault();

  const title = $("title").value.trim();
  if (!title) return;

  const payload = {
    title,
    notes:$("notes").value.trim(),
    category:$("category").value,
    priority:$("priority").value,
    due_date:$("dueDate").value || null,
    visibility:$("visibility").value
  };

  $("saveButton").disabled = true;
  status("Aufgabe wird gespeichert …");

  let result;

  try {
    if (editingId) {
      result = await client
        .from("dd_tasks")
        .update(payload)
        .eq("id",editingId)
        .eq("owner_id",user.id);
    } else {
      result = await client
        .from("dd_tasks")
        .insert({...payload,owner_id:user.id});
    }

    if (result.error) {
      status("Speichern fehlgeschlagen: " + result.error.message,true);
      return;
    }

    resetForm();
    status("Aufgabe gespeichert ♡");
    await loadTasks();
  } catch (error) {
    status("Speichern fehlgeschlagen: " + error.message,true);
  } finally {
    $("saveButton").disabled = false;
  }
});

async function init() {
  if (!window.supabase) {
    status("Supabase konnte nicht geladen werden. Bitte Internetverbindung prüfen.",true);
    return;
  }

  client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const {data:{user:currentUser},error} =
    await client.auth.getUser();

  if (error || !currentUser) {
    $("login").style.display = "block";
    status("Bitte melde dich zuerst an.");
    return;
  }

  const member = await client
    .from("dd_members")
    .select("user_id")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if (member.error || !member.data) {
    $("login").style.display = "block";
    status("Dein Konto ist noch nicht als Mitglied freigeschaltet.",true);
    return;
  }

  user = currentUser;
  $("app").style.display = "block";
  renderCategories();
  status("Willkommen bei euren Aufgaben ♡");
  await loadTasks();
}

init().catch(error =>
  status("Ein Fehler ist aufgetreten: " + error.message,true)
);
</script>
</body>
</html>
