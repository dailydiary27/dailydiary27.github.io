
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort festlegen | DailyDiary</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #f8dce8;
  font-family: Georgia, serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  width: 100%;
  max-width: 430px;
  background: #fffdf5;
  border-radius: 28px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 7px 28px #00000012;
}
h1 { font-size: 30px; }
p { line-height: 1.6; }
input, button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border-radius: 14px;
  font-size: 16px;
}
input {
  border: 2px solid #e4b7c9;
  background: white;
}
button {
  border: 0;
  background: #d07ba1;
  color: white;
  cursor: pointer;
}
button:disabled { opacity: 0.6; }
#message { font-family: Arial, sans-serif; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>Our little world ♡</h1>
  <p>Dein persönlicher Zugang</p>

  <form id="requestForm">
    <h2>Passwort-E-Mail anfordern</h2>
    <input id="email" type="email"
      placeholder="Deine E-Mail-Adresse"
      autocomplete="email" required>
    <button type="submit">Link anfordern</button>
  </form>

  <form id="passwordForm" hidden>
    <h2>Neues Passwort</h2>
    <input id="password" type="password"
      placeholder="Neues Passwort"
      autocomplete="new-password"
      minlength="12" required>
    <input id="confirm" type="password"
      placeholder="Passwort wiederholen"
      autocomplete="new-password"
      minlength="12" required>
    <button type="submit">Passwort speichern</button>
  </form>

  <p id="message" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const client = window.supabase.createClient(
  "https://cqgrtybenbanfppoiuba.supabase.co",
  "sb_publishable_oxqVUkLdxj40fLZ8zCfjtw_wFSftxDw"
);

const requestForm = document.getElementById("requestForm");
const passwordForm = document.getElementById("passwordForm");
const message = document.getElementById("message");

function status(text) {
  message.textContent = text;
}

function showPasswordForm() {
  requestForm.hidden = true;
  passwordForm.hidden = false;
  status("Bitte lege dein neues Passwort fest.");
}

client.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    showPasswordForm();
  }
});

const urlParams = new URLSearchParams(
  window.location.hash.substring(1)
);

if (urlParams.has("error")) {
  status("Der Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.");
}

if (urlParams.get("type") === "recovery") {
  client.auth.getSession().then(({ data, error }) => {
    if (!error && data.session) {
      showPasswordForm();
    }
  });
}

requestForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const button = requestForm.querySelector("button");
  button.disabled = true;
  status("E-Mail wird angefordert...");

  try {
    const email = document.getElementById("email").value.trim();

    const { error } = await client.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          "https://dailydiary27.github.io/reset-password.html"
      }
    );

    if (error) throw error;

    status("Falls die Adresse registriert ist, erhältst du eine E-Mail. Bitte prüfe auch den Spam-Ordner.");
  } catch (error) {
    status("Fehler: " + error.message);
  } finally {
    button.disabled = false;
  }
});

passwordForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    status("Die Passwörter stimmen nicht überein.");
    return;
  }

  const button = passwordForm.querySelector("button");
  button.disabled = true;
  status("Passwort wird gespeichert...");

  try {
    const { error } = await client.auth.updateUser({
      password: password
    });

    if (error) throw error;

    status("Dein Passwort wurde erfolgreich gespeichert! ♡");
    passwordForm.hidden = true;
    await client.auth.signOut();
    history.replaceState({}, "", window.location.pathname);
  } catch (error) {
    status("Fehler: " + error.message);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
