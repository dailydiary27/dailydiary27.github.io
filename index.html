<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DailyDiary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    @font-face {
      font-family: "CochinLocal";
      src: local("Cochin");
    }

    body {
      margin: 0;
      font-family: "CochinLocal", Cochin, Georgia, "Times New Roman", serif;
      background: #f8dce8;
      color: #111;
    }

    header {
      text-align: center;
      padding: 35px 20px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 44px;
    }

    header p {
      margin-top: 10px;
      color: #666;
      font-size: 18px;
    }

    main {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding-bottom: 60px;
    }

    .card {
      background: #fffdf5;
      border-radius: 26px;
      padding: 28px;
      margin-top: 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 32px;
    }

    /* =========================
       KALENDER
    ========================= */

    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .calendar-controls button {
      width: 45px;
      height: 45px;
      padding: 0;
      border-radius: 50%;
    }

    #calendarTitle {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .calendar-weekdays div {
      text-align: center;
      font-weight: bold;
      padding: 8px 2px;
      color: #777;
    }

    .calendar-day {
      min-height: 75px;
      background: #fff;
      border: 2px solid #ead3dc;
      border-radius: 13px;
      padding: 7px;
      cursor: pointer;
      position: relative;
      transition: .15s;
    }

    .calendar-day:hover {
      border-color: #d979a0;
      transform: translateY(-1px);
    }

    .calendar-day.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .calendar-day.today {
      border-color: #e98ab0;
      background: #fff1f6;
    }

    .day-number {
      font-weight: bold;
      font-size: 17px;
    }

    .event-dot {
      margin-top: 7px;
      background: #e98ab0;
      color: white;
      border-radius: 8px;
      padding: 3px 5px;
      font-size: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .year-select {
      width: 120px;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #e4b7c9;
      background: white;
      font-family: inherit;
      font-size: 16px;
    }

    .event-form {
      margin-top: 20px;
      padding: 18px;
      background: #f9edf2;
      border-radius: 18px;
      display: none;
    }

    .event-form.show {
      display: block;
    }

    .selected-date {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .event-input {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 2px solid #e4b7c9;
      font-family: inherit;
      font-size: 17px;
      background: white;
    }

    .event-list {
      margin-top: 15px;
    }

    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid #ead3dc;
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .delete-event {
      background: #eee1e7;
      color: #111;
      padding: 7px 10px;
      font-size: 13px;
    }

    /* =========================
       BUTTONS
    ========================= */

    button {
      border: none;
      border-radius: 14px;
      padding: 13px 20px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      cursor: pointer;
      background: #e98ab0;
      color: white;
      transition: .2s;
    }

    button:hover {
      background: #d9789f;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .secondary {
      background: #eee1e7;
      color: #111;
    }

    .secondary:hover {
      background: #e1d0d8;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    /* =========================
       NACHRICHTEN
    ========================= */

    textarea {
      width: 100%;
      min-height: 330px;
      resize: vertical;
      border: 3px solid #e4b7c9;
      border-radius: 20px;
      padding: 22px;
      background: #fffdf5;
      color: #111;
      font-family: "CochinLocal", Cochin, Georgia, serif;
      font-size: 22px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: #d979a0;
    }

    /* =========================
       KUNSTWERKE
    ========================= */

    canvas {
      width: 100%;
      height: 420px;
      display: block;
      background: #fffdf5;
      border: 3px solid #e4b7c9;
      border-radius: 20px;
      touch-action: none;
    }

    /* =========================
       BILDER
    ========================= */

    .slideshow {
      position: relative;
      width: 100%;
      height: 430px;
      background: #f4e8ed;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slideshow img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .slideshow img.active {
      display: block;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      color: #111;
      font-size: 30px;
      z-index: 5;
    }

    .arrow.left {
      left: 12px;
    }

    .arrow.right {
      right: 12px;
    }

    #noImages {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .upload-area {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      margin-top: 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: #777;
      min-height: 20px;
    }

    .success {
      color: #27834b;
    }

    .error {
      color: #c0392b;
    }

    .error-box {
      display: none;
      background: #fde2e2;
      border: 1px solid #e5a4a4;
      border-radius: 16px;
      padding: 15px;
      margin-top: 15px;
      color: #8b1e1e;
      font-family: Arial, Helvetica, sans-serif;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .connection {
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      color: #777;
      margin-top: 25px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 34px;
      }

      .card {
        padding: 18px;
        border-radius: 20px;
      }

      .card h2 {
        font-size: 27px;
      }

      textarea {
        min-height: 300px;
        font-size: 19px;
      }

      canvas {
        height: 320px;
      }

      .slideshow {
        height: 300px;
      }

      .calendar-day {
        min-height: 55px;
        padding: 5px;
      }

      .event-dot {
        font-size: 10px;
      }

      button {
        width: 100%;
      }

      .calendar-controls button {
        width: 45px;
        flex-shrink: 0;
      }

      .year-select {
        width: 100px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🌸 DailyDiary</h1>
  <p>Unser kleines Tagebuch</p>
</header>

<main>

  <!-- =========================
       KALENDER
  ========================= -->

  <section class="card">

    <h2>📅 Unser Kalender</h2>

    <div class="calendar-controls">

      <button
        id="previousMonth"
        type="button"
      >
        ‹
      </button>

      <select
        id="yearSelect"
        class="year-select"
      ></select>

      <button
        id="nextMonth"
        type="button"
      >
        ›
      </button>

    </div>

    <h3
      id="calendarTitle"
    ></h3>

    <div class="calendar-weekdays">
      <div>Mo</div>
      <div>Di</div>
      <div>Mi</div>
      <div>Do</div>
      <div>Fr</div>
      <div>Sa</div>
      <div>So</div>
    </div>

    <div
      id="calendarGrid"
      class="calendar-grid"
    ></div>

    <div
      id="eventForm"
      class="event-form"
    >

      <div
        id="selectedDate"
        class="selected-date"
      ></div>

      <input
        id="eventInput"
        class="event-input"
        type="text"
        maxlength="200"
        placeholder="Termin eintragen..."
      >

      <div class="buttons">

        <button
          id="saveEvent"
          type="button"
        >
          💾 Termin speichern
        </button>

        <button
          id="closeEvent"
          class="secondary"
          type="button"
        >
          Abbrechen
        </button>

      </div>

      <div
        id="eventList"
        class="event-list"
      ></div>

      <div
        id="calendarError"
        class="error-box"
      ></div>

    </div>

    <div
      id="calendarStatus"
      class="status"
    >
      Kalender wird geladen...
    </div>

  </section>


  <!-- =========================
       NACHRICHTEN
  ========================= -->

  <section class="card">

    <h2>💭 Nachrichten</h2>

    <textarea
      id="textEditor"
      placeholder="Schreibe hier etwas..."
      spellcheck="true"
    ></textarea>

    <div
      id="textStatus"
      class="status"
    >
      Nachrichten werden geladen...
    </div>

    <div
      id="textError"
      class="error-box"
    ></div>

  </section>


  <!-- =========================
       KUNSTWERKE
  ========================= -->

  <section class="card">

    <h2>🎨 Kunstwerke</h2>

    <canvas
      id="drawingCanvas"
    ></canvas>

    <div class="buttons">

      <button
        id="clearDrawingButton"
        type="button"
      >
        🗑️ Zeichnung löschen
      </button>

      <button
        id="saveDrawingButton"
        class="secondary"
        type="button"
      >
        💾 Zeichnung speichern
      </button>

    </div>

    <div
      id="drawingStatus"
      class="status"
    >
      Zeichnung wird geladen...
    </div>

    <div
      id="drawingError"
      class="error-box"
    ></div>

  </section>


  <!-- =========================
       UNSERE MOMENTE
  ========================= -->

  <section class="card">

    <h2>🖼️ Unsere Momente</h2>

    <div
      id="slideshow"
      class="slideshow"
    >

      <div id="noImages">
        Noch keine Bilder vorhanden.
      </div>

      <button
        id="previousButton"
        class="arrow left"
        type="button"
      >
        ‹
      </button>

      <button
        id="nextButton"
        class="arrow right"
        type="button"
      >
        ›
      </button>

    </div>

    <div class="upload-area">

      <input
        type="file"
        id="imageUpload"
        accept="image/*"
        multiple
      >

      <button
        id="uploadButton"
        type="button"
      >
        📷 Bilder hinzufügen
      </button>

    </div>

    <div
      id="imageStatus"
      class="status"
    >
      Bilder werden geladen...
    </div>

    <div
      id="imageError"
      class="error-box"
    ></div>

  </section>


  <div
    id="connectionStatus"
    class="connection"
  >
    Verbindung wird geprüft...
  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://cqgrtybenbanfppoiuba.supabase.co";


/*
 * HIER DEINEN AKTUELLEN PUBLISHABLE KEY EINSETZEN.
 *
 * Beispiel:
 *
 * const SUPABASE_PUBLISHABLE_KEY =
 *   "sb_publishable_...";
 */

const SUPABASE_PUBLISHABLE_KEY =
  "DEIN_PUBLISHABLE_KEY";


const CONTENT_ID = 1;

const BUCKET =
  "daily-diary-images";


let supabaseClient = null;


if (
  window.supabase &&
  SUPABASE_PUBLISHABLE_KEY &&
  SUPABASE_PUBLISHABLE_KEY !==
    "DEIN_PUBLISHABLE_KEY"
) {

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

}


/* =========================================================
   ELEMENTE
========================================================= */

const calendarGrid =
  document.getElementById(
    "calendarGrid"
  );

const calendarTitle =
  document.getElementById(
    "calendarTitle"
  );

const yearSelect =
  document.getElementById(
    "yearSelect"
  );

const calendarStatus =
  document.getElementById(
    "calendarStatus"
  );

const eventForm =
  document.getElementById(
    "eventForm"
  );

const selectedDateElement =
  document.getElementById(
    "selectedDate"
  );

const eventInput =
  document.getElementById(
    "eventInput"
  );

const eventList =
  document.getElementById(
    "eventList"
  );

const calendarError =
  document.getElementById(
    "calendarError"
  );


const textEditor =
  document.getElementById(
    "textEditor"
  );

const textStatus =
  document.getElementById(
    "textStatus"
  );

const textError =
  document.getElementById(
    "textError"
  );


const canvas =
  document.getElementById(
    "drawingCanvas"
  );

const ctx =
  canvas.getContext("2d");

const drawingStatus =
  document.getElementById(
    "drawingStatus"
  );

const drawingError =
  document.getElementById(
    "drawingError"
  );


const slideshow =
  document.getElementById(
    "slideshow"
  );

const noImages =
  document.getElementById(
    "noImages"
  );

const imageStatus =
  document.getElementById(
    "imageStatus"
  );

const imageError =
  document.getElementById(
    "imageError"
  );

const imageUpload =
  document.getElementById(
    "imageUpload"
  );


const connectionStatus =
  document.getElementById(
    "connectionStatus"
  );


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function errorText(error) {

  if (!error)
    return "Unbekannter Fehler.";

  if (error.message)
    return error.message;

  return String(error);

}


function showError(
  element,
  error,
  fallback
) {

  console.error(error);

  element.innerText =
    errorText(error) ||
    fallback;

  element.style.display =
    "block";

}


function hideError(element) {

  element.innerText =
    "";

  element.style.display =
    "none";

}


/* =========================================================
   KALENDER
========================================================= */

const monthNames = [
  "Januar",
  "Februar",
  "März",
  "April",
  "Mai",
  "Juni",
  "Juli",
  "August",
  "September",
  "Oktober",
  "November",
  "Dezember"
];


let currentDate =
  new Date();


let currentMonth =
  currentDate.getMonth();


let currentYear =
  currentDate.getFullYear();


let selectedDate =
  null;


let calendarEvents =
  [];


/*
 * Wir zeigen die Jahre ab 2024
 * bis 2030 an.
 *
 * Falls wir später über 2030 hinausgehen,
 * wird das aktuelle Jahr ebenfalls berücksichtigt.
 */

function createYearOptions() {

  yearSelect.innerHTML =
    "";

  const startYear =
    Math.min(
      2024,
      currentYear
    );

  const endYear =
    Math.max(
      2030,
      currentYear
    );


  for (
    let year = startYear;
    year <= endYear;
    year++
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      year;

    option.textContent =
      year;

    yearSelect.appendChild(
      option
    );

  }


  yearSelect.value =
    currentYear;

}


function dateKey(
  year,
  month,
  day
) {

  return (
    year +
    "-" +
    String(month + 1)
      .padStart(2, "0") +
    "-" +
    String(day)
      .padStart(2, "0")
  );

}


function renderCalendar() {

  calendarTitle.innerText =
    monthNames[currentMonth] +
    " " +
    currentYear;


  calendarGrid.innerHTML =
    "";


  const firstDay =
    new Date(
      currentYear,
      currentMonth,
      1
    );


  let weekday =
    firstDay.getDay();


  /*
   * JavaScript:
   * Sonntag = 0
   *
   * Für unseren Kalender:
   * Montag = 0
   */

  weekday =
    weekday === 0
      ? 6
      : weekday - 1;


  const daysInMonth =
    new Date(
      currentYear,
      currentMonth + 1,
      0
    ).getDate();


  for (
    let i = 0;
    i < weekday;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "calendar-day empty";

    calendarGrid.appendChild(
      empty
    );

  }


  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const cell =
      document.createElement(
        "div"
      );


    cell.className =
      "calendar-day";


    const key =
      dateKey(
        currentYear,
        currentMonth,
        day
      );


    const today =
      new Date();


    if (
      today.getFullYear() ===
        currentYear &&
      today.getMonth() ===
        currentMonth &&
      today.getDate() ===
        day
    ) {

      cell.classList.add(
        "today"
      );

    }


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "day-number";

    number.innerText =
      day;

    cell.appendChild(
      number
    );


    const events =
      calendarEvents.filter(
        event =>
          event.event_date === key
      );


    events.forEach(
      event => {

        const dot =
          document.createElement(
            "div"
          );

        dot.className =
          "event-dot";

        dot.innerText =
          event.title;

        cell.appendChild(
          dot
        );

      }
    );


    cell.addEventListener(
      "click",
      function() {

        openEventForm(key);

      }
    );


    calendarGrid.appendChild(
      cell
    );

  }

}


function openEventForm(
  key
) {

  selectedDate =
    key;


  eventForm.classList.add(
    "show"
  );


  selectedDateElement.innerText =
    "Termin für " +
    formatDate(key);


  eventInput.value =
    "";


  renderEventList();


  eventInput.focus();

}


function formatDate(
  key
) {

  const parts =
    key.split("-");


  return (
    parts[2] +
    "." +
    parts[1] +
    "." +
    parts[0]
  );

}


function renderEventList() {

  eventList.innerHTML =
    "";


  if (!selectedDate)
    return;


  const events =
    calendarEvents.filter(
      event =>
        event.event_date ===
        selectedDate
    );


  if (events.length === 0) {

    const empty =
      document.createElement(
        "div"
      );

    empty.innerText =
      "Noch kein Termin an diesem Tag.";

    empty.style.color =
      "#777";

    eventList.appendChild(
      empty
    );

    return;

  }


  events.forEach(
    event => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "event-item";


      const title =
        document.createElement(
          "span"
        );

      title.innerText =
        event.title;


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "delete-event";

      deleteButton.innerText =
        "Löschen";


      deleteButton.addEventListener(
        "click",
        function() {

          deleteEvent(
            event.id
          );

        }
      );


      item.appendChild(
        title
      );

      item.appendChild(
        deleteButton
      );

      eventList.appendChild(
        item
      );

    }
  );

}


async function loadEvents() {

  if (!supabaseClient) {

    calendarStatus.innerText =
      "Supabase ist nicht eingerichtet.";

    return;

  }


  hideError(
    calendarError
  );


  calendarStatus.innerText =
    "Termine werden geladen...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("diary_events")
        .select("*")
        .order(
          "event_date",
          {
            ascending: true
          }
        );


    if (error)
      throw error;


    calendarEvents =
      data || [];


    renderCalendar();


    calendarStatus.innerText =
      "Kalender geladen ✓";


  } catch (error) {

    showError(
      calendarError,
      error,
      "Termine konnten nicht geladen werden."
    );


    calendarStatus.innerText =
      "Fehler beim Laden der Termine.";

  }

}


async function saveEvent() {

  if (!selectedDate)
    return;


  const title =
    eventInput.value.trim();


  if (!title) {

    alert(
      "Bitte einen Termin eingeben."
    );

    return;

  }


  if (!supabaseClient) {

    alert(
      "Supabase ist nicht eingerichtet."
    );

    return;

  }


  hideError(
    calendarError
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("diary_events")
        .insert({
          event_date:
            selectedDate,

          title:
            title
        })
        .select()
        .single();


    if (error)
      throw error;


    calendarEvents.push(
      data
    );


    renderCalendar();

    renderEventList();


    eventInput.value =
      "";


    calendarStatus.innerText =
      "Termin gespeichert ✓";


  } catch (error) {

    showError(
      calendarError,
      error,
      "Termin konnte nicht gespeichert werden."
    );

  }

}


async function deleteEvent(
  id
) {

  if (!supabaseClient)
    return;


  try {

    const {
      error
    } =
      await supabaseClient
        .from("diary_events")
        .delete()
        .eq(
          "id",
          id
        );


    if (error)
      throw error;


    calendarEvents =

/* =========================================================
   KUNSTWERKE / CANVAS
========================================================= */

let drawing = false;

let drawingChanged = false;


function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();


  const oldImage =
    canvas.width > 0
      ? canvas.toDataURL()
      : null;


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.fillStyle =
    "#fffdf5";


  ctx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );


  if (oldImage) {

    const img =
      new Image();


    img.onload =
      function() {

        ctx.drawImage(
          img,
          0,
          0,
          rect.width,
          rect.height
        );

      };


    img.src =
      oldImage;

  }

}


function canvasPosition(
  event
) {

  const rect =
    canvas.getBoundingClientRect();


  return {

    x:
      event.clientX -
      rect.left,

    y:
      event.clientY -
      rect.top

  };

}


canvas.addEventListener(
  "pointerdown",
  function(event) {

    event.preventDefault();

    drawing =
      true;

    drawingChanged =
      true;


    canvas.setPointerCapture(
      event.pointerId
    );


    const p =
      canvasPosition(event);


    ctx.beginPath();

    ctx.moveTo(
      p.x,
      p.y
    );

  }
);


canvas.addEventListener(
  "pointermove",
  function(event) {

    if (!drawing)
      return;


    event.preventDefault();


    const p =
      canvasPosition(event);


    ctx.lineWidth =
      4;

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    ctx.strokeStyle =
      "#111";


    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();

  }
);


canvas.addEventListener(
  "pointerup",
  async function() {

    if (!drawing)
      return;


    drawing =
      false;


    if (drawingChanged) {

      drawingChanged =
        false;

      await saveDrawing();

    }

  }
);


async function loadDrawing() {

  if (!supabaseClient)
    return;


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("website_content")
        .select(
          "drawing_data"
        )
        .eq(
          "id",
          CONTENT_ID
        )
        .maybeSingle();


    if (error)
      throw error;


    if (
      data &&
      data.drawing_data
    ) {

      const img =
        new Image();


      img.onload =
        function() {

          ctx.drawImage(
            img,
            0,
            0,
            canvas.clientWidth,
            canvas.clientHeight
          );

        };


      img.src =
        data.drawing_data;

    }


    drawingStatus.innerText =
      "Kunstwerk geladen ✓";


  } catch (error) {

    showError(
      drawingError,
      error,
      "Kunstwerk konnte nicht geladen werden."
    );


    drawingStatus.innerText =
      "Fehler beim Laden.";

  }

}


async function saveDrawing() {

  if (!supabaseClient)
    return;


  try {

    const image =
      canvas.toDataURL(
        "image/png"
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("website_content")
        .update({
          drawing_data:
            image
        })
        .eq(
          "id",
          CONTENT_ID
        )
        .select();


    if (error)
      throw error;


    if (
      !data ||
      data.length === 0
    ) {

      throw new Error(
        "Das Kunstwerk wurde nicht gespeichert. Prüfe die RLS-UPDATE-Policy."
      );

    }


    drawingStatus.innerText =
      "Kunstwerk gespeichert ✓";


  } catch (error) {

    showError(
      drawingError,
      error,
      "Kunstwerk konnte nicht gespeichert werden."
    );


    drawingStatus.innerText =
      "Fehler beim Speichern.";

  }

}

).addEventListener(

);


/* =========================================================
   UNSERE MOMENTE
========================================================= */

let images = [];

let currentImage = 0;


async function loadImages() {

  if (!supabaseClient)
    return;


  hideError(
    imageError
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .list(
          "",
          {
            limit: 100,
            offset: 0,
            sortBy: {
              column:
                "created_at",
              order:
                "desc"
            }
          }
        );


    if (error)
      throw error;


    images =
      (data || [])
        .filter(
          file =>
            file.name
        );


    currentImage =
      0;


    displayImages();


    imageStatus.innerText =
      images.length +
      " Bild(er) vorhanden ✓";


  } catch (error) {

    showError(
      imageError,
      error,
      "Bilder konnten nicht geladen werden."
    );


    imageStatus.innerText =
      "Fehler beim Laden.";

  }

}


function displayImages() {

  slideshow
    .querySelectorAll(
      "img"
    )
    .forEach(
      img =>
        img.remove()
    );


  if (
    images.length === 0
  ) {

    noImages.style.display =
      "block";

    return;

  }


  noImages.style.display =
    "none";


  images.forEach(
    function(file, index) {

      const {
        data
      } =
        supabaseClient
          .storage
          .from(BUCKET)
          .getPublicUrl(
            file.name
          );


      const img =
        document.createElement(
          "img"
        );


      img.src =
        data.publicUrl;


      img.alt =
        "Unsere Momente";


      if (
        index ===
        currentImage
      ) {

        img.classList.add(
          "active"
        );

      }


      slideshow.insertBefore(
        img,
        document.getElementById(
          "previousButton"
        )
      );

    }
  );

}


document.getElementById(
  "nextButton"
).addEventListener(
  "click",
  function() {

    if (
      images.length === 0
    )
      return;


    currentImage =
      (
        currentImage + 1
      ) %
      images.length;


    displayImages();

  }
);


document.getElementById(
  "previousButton"
).addEventListener(
  "click",
  function() {

    if (
      images.length === 0
    )
      return;


    currentImage =
      (
        currentImage -
        1 +
        images.length
      ) %
      images.length;


    displayImages();

  }
);


document.getElementById(
  "uploadButton"
).addEventListener(
  "click",
  async function() {

    const files =
      Array.from(
        imageUpload.files || []
      );


    if (
      files.length === 0
    ) {

      alert(
        "Bitte zuerst ein Bild auswählen."
      );

      return;

    }


    try {

      for (
        const file of files
      ) {

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const fileName =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 10) +
          "-" +
          safeName;


        const {
          error
        } =
          await supabaseClient
            .storage
            .from(BUCKET)
            .upload(
              fileName,
              file
            );


        if (error)
          throw error;

      }


      imageUpload.value =
        "";


      await loadImages();


      imageStatus.innerText =
        "Bilder erfolgreich gespeichert ✓";


    } catch (error) {

      showError(
        imageError,
        error,
        "Bilder konnten nicht hochgeladen werden."
      );

    }

  }
);


/* =========================================================
   START
========================================================= */

async function start() {

  createYearOptions();

  renderCalendar();

  resizeCanvas();


  if (!supabaseClient) {

    connectionStatus.innerText =
      "❌ Supabase Publishable Key fehlt.";

    textStatus.innerText =
      "Supabase ist nicht eingerichtet.";

    drawingStatus.innerText =
      "Supabase ist nicht eingerichtet.";

    imageStatus.innerText =
      "Supabase ist nicht eingerichtet.";

    calendarStatus.innerText =
      "Supabase ist nicht eingerichtet.";

    return;

  }


  connectionStatus.innerText =
    "🟢 Supabase verbunden";


  await Promise.all([
    loadEvents(),
    loadText(),
    loadDrawing(),
    loadImages()
  ]);

}


start();
