<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DailyDiary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cochin", Georgia, serif;
      background: #f8dce8;
      color: #111;
    }

    header {
      text-align: center;
      padding: 35px 20px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 44px;
      font-weight: 700;
    }

    header p {
      margin-top: 8px;
      color: #555;
      font-size: 19px;
    }

    main {
      width: 92%;
      max-width: 1000px;
      margin: auto;
      padding-bottom: 60px;
    }

    .card {
      background: #fffdf5;
      border-radius: 22px;
      padding: 25px;
      margin-top: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #111;
      font-size: 30px;
    }

    /* =====================================================
       KALENDER
       ===================================================== */

    .calendar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .calendar-year {
      font-size: 42px;
      font-weight: 700;
      margin: 0;
    }

    .year-buttons {
      display: flex;
      gap: 8px;
    }

    .year-buttons button {
      width: auto;
      min-width: 50px;
      padding: 10px 14px;
    }

    .calendar-divider {
      height: 1px;
      background: #d8d1ce;
      margin-bottom: 28px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 48px 30px;
    }

    .month h3 {
      font-size: 32px;
      margin: 0 0 14px;
      font-weight: 700;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays {
      margin-bottom: 6px;
      font-size: 13px;
      color: #777;
    }

    .day {
      min-height: 32px;
      font-size: 16px;
      padding: 5px 2px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
    }

    .day:hover {
      background: #f2c8d9;
    }

    .day.today {
      background: #df8fb0;
      color: white;
      font-weight: bold;
    }

    .day.has-event::after {
      content: "";
      position: absolute;
      bottom: 1px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d46d96;
    }

    .calendar-help {
      margin-top: 25px;
      color: #777;
      font-size: 15px;
      text-align: center;
    }

    /* =====================================================
       TERMINE
       ===================================================== */

    .event-panel {
      border-top: 1px solid #e2d7dc;
      margin-top: 25px;
      padding-top: 22px;
    }

    .selected-date {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .event-form {
      display: grid;
      gap: 10px;
    }

    .event-form input,
    .event-form textarea {
      width: 100%;
      border: 2px solid #e4b7c9;
      border-radius: 12px;
      padding: 13px;
      font-family: inherit;
      font-size: 17px;
      background: #fffdf5;
      outline: none;
    }

    .event-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .event-form input:focus,
    .event-form textarea:focus {
      border-color: #d979a0;
    }

    .event-list {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .event-item {
      background: #f8e5ed;
      border-radius: 14px;
      padding: 13px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .event-title {
      font-weight: bold;
      font-size: 18px;
    }

    .event-description {
      margin-top: 4px;
      color: #555;
      white-space: pre-wrap;
    }

    .delete-event {
      background: #d9799f;
      padding: 8px 11px;
      font-size: 14px;
      width: auto;
      flex-shrink: 0;
    }

    /* =====================================================
       NACHRICHTEN
       ===================================================== */

    #textEditor {
      width: 100%;
      min-height: 300px;
      border: 2px solid #e4b7c9;
      border-radius: 16px;
      padding: 18px;
      background: #fffdf5;
      color: #111;
      font-family: inherit;
      font-size: 19px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    #textEditor:focus {
      border-color: #d979a0;
    }

    .save-status {
      margin-top: 10px;
      color: #777;
      font-size: 14px;
    }

    /* =====================================================
       KUNSTWERKE
       ===================================================== */

    #drawingCanvas {
      width: 100%;
      height: 400px;
      display: block;
      background: #fffdf5;
      border: 2px solid #e4b7c9;
      border-radius: 16px;
      touch-action: none;
    }

    .drawing-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-family: inherit;
      font-size: 17px;
      cursor: pointer;
      background: #e98ab0;
      color: white;
    }

    button:hover {
      background: #d9789f;
    }

    .secondary {
      background: #eee1e7;
      color: #111;
    }

    /* =====================================================
       UNSERE MOMENTE
       ===================================================== */

    .slideshow {
      position: relative;
      width: 100%;
      height: 420px;
      background: #f4e8ed;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slideshow img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .slideshow img.active {
      display: block;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      color: #111;
      font-size: 25px;
      z-index: 5;
    }

    .arrow.left {
      left: 12px;
    }

    .arrow.right {
      right: 12px;
    }

    #noImages {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .upload-area {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="file"] {
      max-width: 100%;
      font-family: inherit;
    }

    /* =====================================================
       MOBIL
       ===================================================== */

    @media (max-width: 750px) {

      header h1 {
        font-size: 34px;
      }

      header p {
        font-size: 16px;
      }

      .card {
        padding: 18px;
      }

      .calendar-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .calendar-year {
        font-size: 34px;
      }

      .month h3 {
        font-size: 28px;
      }

      #drawingCanvas {
        height: 320px;
      }

      .slideshow {
        height: 300px;
      }

      button {
        width: 100%;
      }

      .year-buttons button {
        width: auto;
      }

      .event-item {
        flex-direction: column;
      }

      .delete-event {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🌸 DailyDiary</h1>
  <p>Unser kleines Tagebuch</p>
</header>

<main>

  <!-- =====================================================
       KALENDER
       ===================================================== -->

  <section class="card">

    <div class="calendar-top">

      <h2 class="calendar-year" id="calendarYear">
        2026
      </h2>

      <div class="year-buttons">
        <button class="secondary" onclick="changeYear(-1)">
          ‹
        </button>

        <button class="secondary" onclick="changeYear(1)">
          ›
        </button>
      </div>

    </div>

    <div class="calendar-divider"></div>

    <div id="calendarGrid" class="calendar-grid"></div>

    <div class="calendar-help">
      Tippe auf einen Tag, um einen Termin einzutragen.
    </div>

    <div class="event-panel">

      <div class="selected-date" id="selectedDate">
        Bitte einen Tag auswählen
      </div>

      <div class="event-form">

        <input
          type="text"
          id="eventTitle"
          placeholder="Termin"
        >

        <textarea
          id="eventDescription"
          placeholder="Beschreibung (optional)"
        ></textarea>

        <button onclick="addEvent()">
          📅 Termin speichern
        </button>

      </div>

      <div class="event-list" id="eventList"></div>

      <div class="save-status" id="calendarStatus">
        Kalender wird geladen...
      </div>

    </div>

  </section>


  <!-- =====================================================
       NACHRICHTEN
       ===================================================== -->

  <section class="card">

    <h2>💭 Nachrichten</h2>

    <textarea
      id="textEditor"
      placeholder="Schreibe hier etwas..."
    ></textarea>

    <div class="save-status" id="textStatus">
      Wird geladen...
    </div>

  </section>


  <!-- =====================================================
       KUNSTWERKE
       ===================================================== -->

  <section class="card">

    <h2>🎨 Kunstwerke</h2>

    <canvas id="drawingCanvas"></canvas>

    <div class="drawing-buttons">

      <button onclick="clearDrawing()">
        🗑️ Löschen
      </button>

      <button class="secondary" onclick="saveDrawing()">
        💾 Zeichnung speichern
      </button>

    </div>

    <div class="save-status" id="drawingStatus">
      Zeichnung wird geladen...
    </div>

  </section>


  <!-- =====================================================
       UNSERE MOMENTE
       ===================================================== -->

  <section class="card">

    <h2>🖼️ Unsere Momente</h2>

    <div class="slideshow" id="slideshow">

      <div id="noImages">
        Noch keine Bilder vorhanden.
      </div>

      <button
        class="arrow left"
        onclick="previousImage()"
      >
        ‹
      </button>

      <button
        class="arrow right"
        onclick="nextImage()"
      >
        ›
      </button>

    </div>

    <div class="upload-area">

      <input
        type="file"
        id="imageUpload"
        accept="image/*"
        multiple
      >

      <button onclick="uploadImages()">
        📷 Bilder hinzufügen
      </button>

    </div>

    <div class="save-status" id="imageStatus">
      Bilder werden geladen...
    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ========================================================
     SUPABASE
     ======================================================== */

  const SUPABASE_URL =
    "https://cqgrtybenbanfppoiuba.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjZ3J0eWJlbmJhbmZwcG9pdWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MzY4MTEsImV4cCI6MjEwMzAxMjgxMX0.8qwqAGwH4ylkI-b-nAgfkjJma4KbBP4we789S9pdaAk";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ========================================================
     KALENDER
     ======================================================== */

  const MIN_YEAR = 2026;
  const MAX_YEAR = 2030;

  let selectedYear = new Date().getFullYear();

  if (selectedYear < MIN_YEAR) {
    selectedYear = MIN_YEAR;
  }

  if (selectedYear > MAX_YEAR) {
    selectedYear = MAX_YEAR;
  }

  let selectedDate = null;
  let calendarEvents = [];


  const monthNames = [
    "Jan",
    "Feb",
    "Mär",
    "Apr",
    "Mai",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Okt",
    "Nov",
    "Dez"
  ];


  const weekdayNames = [
    "So",
    "Mo",
    "Di",
    "Mi",
    "Do",
    "Fr",
    "Sa"
  ];


  function formatDate(dateString) {

    const parts =
      dateString.split("-");

    return (
      parts[2] +
      "." +
      parts[1] +
      "." +
      parts[0]
    );
  }


  function dateKey(year, month, day) {

    return (
      year +
      "-" +
      String(month + 1).padStart(2, "0") +
      "-" +
      String(day).padStart(2, "0")
    );

  }


  function renderCalendar() {

    document.getElementById(
      "calendarYear"
    ).innerText = selectedYear;

    const grid =
      document.getElementById(
        "calendarGrid"
      );

    grid.innerHTML = "";


    for (
      let month = 0;
      month < 12;
      month++
    ) {

      const monthBox =
        document.createElement("div");

      monthBox.className =
        "month";


      const title =
        document.createElement("h3");

      title.innerText =
        monthNames[month];

      monthBox.appendChild(title);


      const weekdays =
        document.createElement("div");

      weekdays.className =
        "weekdays";


      weekdayNames.forEach(
        dayName => {

          const day =
            document.createElement("div");

          day.innerText =
            dayName;

          weekdays.appendChild(day);

        }
      );


      monthBox.appendChild(
        weekdays
      );


      const days =
        document.createElement("div");

      days.className =
        "days";


      const firstDay =
        new Date(
          selectedYear,
          month,
          1
        ).getDay();


      const daysInMonth =
        new Date(
          selectedYear,
          month + 1,
          0
        ).getDate();


      for (
        let i = 0;
        i < firstDay;
        i++
      ) {

        const empty =
          document.createElement("div");

        days.appendChild(empty);

      }


      for (
        let dayNumber = 1;
        dayNumber <= daysInMonth;
        dayNumber++
      ) {

        const day =
          document.createElement("div");

        day.className = "day";

        day.innerText =
          dayNumber;


        const key =
          dateKey(
            selectedYear,
            month,
            dayNumber
          );


        const today =
          new Date();


        if (
          today.getFullYear() === selectedYear &&
          today.getMonth() === month &&
          today.getDate() === dayNumber
        ) {

          day.classList.add("today");

        }


        const hasEvent =
          calendarEvents.some(
            event =>
              event.event_date === key
          );


        if (hasEvent) {

          day.classList.add(
            "has-event"
          );

        }


        day.onclick =
          function() {

            selectDate(key);

          };


        days.appendChild(day);

      }


      monthBox.appendChild(days);

      grid.appendChild(monthBox);

    }

  }


  function changeYear(amount) {

    const newYear =
      selectedYear + amount;

    if (
      newYear < MIN_YEAR ||
      newYear > MAX_YEAR
    ) {
      return;
    }

    selectedYear = newYear;

    selectedDate = null;

    document.getElementById(
      "eventList"
    ).innerHTML = "";

    document.getElementById(
      "selectedDate"
    ).innerText =
      "Bitte einen Tag auswählen";

    loadCalendarEvents();

  }


  async function loadCalendarEvents() {

    document.getElementById(
      "calendarStatus"
    ).innerText =
      "Kalender wird geladen...";


    const start =
      selectedYear + "-01-01";

    const end =
      selectedYear + "-12-31";


    const { data, error } =
      await supabaseClient
        .from("calendar_events")
        .select("*")
        .gte("event_date", start)
        .lte("event_date", end)
        .order("event_date", {
          ascending: true
        });


    if (error) {

      console.error(error);

      document.getElementById(
        "calendarStatus"
      ).innerText =
        "Fehler beim Laden des Kalenders.";

      renderCalendar();

      return;

    }


    calendarEvents =
      data || [];

    renderCalendar();


    document.getElementById(
      "calendarStatus"
    ).innerText =
      calendarEvents.length +
      " Termin(e) gespeichert ✓";

  }


  function selectDate(dateString) {

    selectedDate =
      dateString;


    document.getElementById(
      "selectedDate"
    ).innerText =
      "📅 " +
      formatDate(dateString);


    document.getElementById(
      "eventTitle"
    ).focus();


    renderEventList();

  }


  function renderEventList() {

    const list =
      document.getElementById(
        "eventList"
      );

    list.innerHTML = "";


    if (!selectedDate) {
      return;
    }


    const events =
      calendarEvents.filter(
        event =>
          event.event_date ===
          selectedDate
      );


    if (events.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "save-status";

      empty.innerText =
        "Für diesen Tag gibt es noch keinen Termin.";

      list.appendChild(empty);

      return;

    }


    events.forEach(
      event => {

        const item =
          document.createElement("div");

        item.className =
          "event-item";


        const content =
          document.createElement("div");


        const title =
          document.createElement("div");

        title.className =
          "event-title";

        title.innerText =
          event.title;


        content.appendChild(title);


        if (event.description) {

          const description =
            document.createElement("div");

          description.className =
            "event-description";

          description.innerText =
            event.description;

          content.appendChild(
            description
          );

        }


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-event";

        deleteButton.innerText =
          "Löschen";

        deleteButton.onclick =
          () => deleteEvent(event.id);


        item.appendChild(content);

        item.appendChild(
          deleteButton
        );

        list.appendChild(item);

      }
    );

  }


  async function addEvent() {

    if (!selectedDate) {

      alert(
        "Bitte zuerst einen Tag auswählen."
      );

      return;

    }


    const title =
      document.getElementById(
        "eventTitle"
      ).value.trim();


    const description =
      document.getElementById(
        "eventDescription"
      ).value.trim();


    if (!title) {

      alert(
        "Bitte einen Termin eingeben."
      );

      return;

    }


    document.getElementById(
      "calendarStatus"
    ).innerText =
      "Termin wird gespeichert...";


    const { data, error } =
      await supabaseClient
        .from("calendar_events")
        .insert({

          event_date:
            selectedDate,

          title:
            title,

          description:
            description

        })
        .select()
        .single();


    if (error) {

      console.error(error);

      document.getElementById(
        "calendarStatus"
      ).innerText =
        "Fehler beim Speichern des Termins.";

      return;

    }


    calendarEvents.push(data);


    document.getElementById(
      "eventTitle"
    ).value = "";


    document.getElementById(
      "eventDescription"
    ).value = "";


    renderCalendar();

    renderEventList();


    document.getElementById(
      "calendarStatus"
    ).innerText =
      "Termin gespeichert ✓";

  }


  async function deleteEvent(id) {

    const confirmed =
      confirm(
        "Diesen Termin wirklich löschen?"
      );


    if (!confirmed) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("calendar_events")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Der Termin konnte nicht gelöscht werden."
      );

      return;

    }


    calendarEvents =
      calendarEvents.filter(
        event =>
          event.id !== id
      );


    renderCalendar();

    renderEventList();

  }


  /* ========================================================
     NACHRICHTEN
     ======================================================== */

  const textEditor =
    document.getElementById(
      "textEditor"
    );

  const textStatus =
    document.getElementById(
      "textStatus"
    );


  async function loadText() {

    const { data, error } =
      await supabaseClient
        .from("website_content")
        .select("text_content")
        .eq("id", 1)
        .single();


    if (error) {

      console.error(error);

      textStatus.innerText =
  "Fehler: " + error.message;

      return;

    }


    textEditor.value =
      data.text_content || "";


    textStatus.innerText =
      "Nachrichten geladen ✓";

  }


  let saveTimer;


  textEditor.addEventListener(
    "input",
    function() {

      textStatus.innerText =
        "Speichern...";

      clearTimeout(saveTimer);

      saveTimer =
        setTimeout(
          saveText,
          700
        );

    }
  );


  async function saveText() {

    const { error } =
      await supabaseClient
        .from("website_content")
        .update({

          text_content:
            textEditor.value

        })
        .eq("id", 1);


    if (error) {

  console.error(error);

  textStatus.innerText =
    "Fehler: " + error.message;

  return;
}

      return;

    }


    textStatus.innerText =
      "Gespeichert ✓";

  }


  /* ========================================================
     KUNSTWERKE / CANVAS
     ======================================================== */

  const canvas =
    document.getElementById(
      "drawingCanvas"
    );

  const ctx =
    canvas.getContext("2d");

  const drawingStatus =
    document.getElementById(
      "drawingStatus"
    );


  let drawing = false;


  function setupCanvas() {

    const rect =
      canvas.getBoundingClientRect();

    const ratio =
      window.devicePixelRatio || 1;


    canvas.width =
      rect.width * ratio;

    canvas.height =
      rect.height * ratio;


    ctx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );


    ctx.fillStyle =
      "#fffdf5";

    ctx.fillRect(
      0,
      0,
      rect.width,
      rect.height
    );

  }


  function getPosition(event) {

    const rect =
      canvas.getBoundingClientRect();


    return {

      x:
        event.clientX -
        rect.left,

      y:
        event.clientY -
        rect.top

    };

  }


  canvas.addEventListener(
    "pointerdown",
    function(event) {

      drawing = true;

      canvas.setPointerCapture(
        event.pointerId
      );


      const pos =
        getPosition(event);


      ctx.beginPath();

      ctx.moveTo(
        pos.x,
        pos.y
      );

    }
  );


  canvas.addEventListener(
    "pointermove",
    function(event) {

      if (!drawing) {
        return;
      }


      const pos =
        getPosition(event);


      ctx.lineWidth = 4;

      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";

      ctx.strokeStyle =
        "#111";


      ctx.lineTo(
        pos.x,
        pos.y
      );

      ctx.stroke();

    }
  );


  canvas.addEventListener(
    "pointerup",
    function() {

      drawing = false;

      saveDrawing();

    }
  );


  canvas.addEventListener(
    "pointercancel",
    function() {

      drawing = false;

    }
  );


  async function loadDrawing() {

    const { data, error } =
      await supabaseClient
        .from("website_content")
        .select("drawing_data")
        .eq("id", 1)
        .single();


    if (error) {

      console.error(error);

      drawingStatus.innerText =
        "Fehler beim Laden.";

      return;

    }


    if (data.drawing_data) {

      const img =
        new Image();


      img.onload =
        function() {

          const rect =
            canvas.getBoundingClientRect();


          ctx.drawImage(
            img,
            0,
            0,
            rect.width,
            rect.height
          );

        };


      img.src =
        data.drawing_data;

    }


    drawingStatus.innerText =
      "Kunstwerk geladen ✓";

  }


  async function saveDrawing() {

    const image =
      canvas.toDataURL(
        "image/png"
      );


    const { error } =
      await supabaseClient
        .from("website_content")
        .update({

          drawing_data:
            image

        })
        .eq("id", 1);


    if (error) {

      console.error(error);

      drawingStatus.innerText =
        "Fehler beim Speichern.";

      return;

    }


    drawingStatus.innerText =
      "Kunstwerk gespeichert ✓";

  }


  async function clearDrawing() {

    const rect =
      canvas.getBoundingClientRect();


    ctx.clearRect(
      0,
      0,
      rect.width,
      rect.height
    );


    ctx.fillStyle =
      "#fffdf5";


    ctx.fillRect(
      0,
      0,
      rect.width,
      rect.height
    );


    await saveDrawing();

  }


  /* ========================================================
     BILDER / UNSERE MOMENTE
     ======================================================== */

  const BUCKET =
    "daily-diary-images";


  let images = [];

  let currentImage = 0;


  async function loadImages() {

    const { data, error } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .list(
          "",
          {
            limit: 100,
            sortBy: {
              column: "created_at",
              order: "asc"
            }
          }
        );


    if (error) {

      console.error(error);

      document.getElementById(
        "imageStatus"
      ).innerText =
        "Fehler beim Laden der Bilder.";

      return;

    }


    images =
      data || [];


    currentImage = 0;

    displayImages();

  }


  function displayImages() {

    const slideshow =
      document.getElementById(
        "slideshow"
      );


    slideshow
      .querySelectorAll("img")
      .forEach(
        img => img.remove()
      );


    const noImages =
      document.getElementById(
        "noImages"
      );


    if (images.length === 0) {

      noImages.style.display =
        "block";

      return;

    }


    noImages.style.display =
      "none";


    images.forEach(
      function(file, index) {

        const { data } =
          supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(
              file.name
            );


        const img =
          document.createElement(
            "img"
          );


        img.src =
          data.publicUrl;


        if (
          index === currentImage
        ) {

          img.classList.add(
            "active"
          );

        }


        slideshow.insertBefore(
          img,
          slideshow.querySelector(
            ".arrow.left"
          )
        );

      }
    );


    document.getElementById(
      "imageStatus"
    ).innerText =
      images.length +
      " Bild(er) vorhanden ✓";

  }


  function nextImage() {

    if (
      images.length === 0
    ) {
      return;
    }


    currentImage =
      (
        currentImage + 1
      ) %
      images.length;


    displayImages();

  }


  function previousImage() {

    if (
      images.length === 0
    ) {
      return;
    }


    currentImage =
      (
        currentImage -
        1 +
        images.length
      ) %
      images.length;


    displayImages();

  }


  async function uploadImages() {

    const input =
      document.getElementById(
        "imageUpload"
      );


    if (
      !input.files ||
      input.files.length === 0
    ) {

      alert(
        "Bitte zuerst ein Bild auswählen."
      );

      return;

    }


    const status =
      document.getElementById(
        "imageStatus"
      );


    status.innerText =
      "Bilder werden hochgeladen...";


    for (
      const file of input.files
    ) {

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "-" +
        file.name;


      const { error } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .upload(
            fileName,
            file
          );


      if (error) {

        console.error(error);

        status.innerText =
          "Fehler beim Hochladen.";

        return;

      }

    }


    input.value = "";

    await loadImages();

  }


  /* ========================================================
     START
     ======================================================== */

  async function start() {

    setupCanvas();

    renderCalendar();

    await Promise.all([

      loadCalendarEvents(),

      loadText(),

      loadDrawing(),

      loadImages()

    ]);

  }


  start();

</script>
